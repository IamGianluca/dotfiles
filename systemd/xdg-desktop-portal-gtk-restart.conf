# The GTK portal backend holds an X connection.  When the X session goes away
# (logout, X restart) it exits with status 1, and since the unit has no restart
# policy it stays dead -- every portal-based dialog (Chrome's file chooser, ...)
# then fails silently until something happens to activate it again.
#
# Keep retrying (no rate limit) so it comes back even if it starts before the
# new X server is ready.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5

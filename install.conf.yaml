- defaults:
    link:
      relink: true

- clean: ['~']

- create:
  - ~/.claude
  - ~/.config/nvim
  - ~/.config/ghostty
  - ~/.config/hunk
  - ~/.config/direnv
  - ~/.zfunc
  - ~/.local/bin

- link:
    ~/.tmux.conf: tmux/tmux.conf
    ~/.config/ghostty/config: ghostty/config
    ~/.config/jj/config.toml: 
      force: true
      path: jj/config.toml
    ~/.config/hunk/config.toml: hunk/config.toml
    ~/.config/gtk-4.0:
      if: &linux '[ "$(uname)" = Linux ]'
      force: true
      path: gtk-4.0/
    ~/.zshrc: 
      force: true
      path: zsh/zshrc
    ~/.zshenv:
      force: true
      path: zsh/zshenv
    ~/.p10k.zsh: zsh/p10k.zsh
    ~/.gitconfig:
      force: true
      path: git/gitconfig
    ~/.config/direnv/direnvrc: direnv/direnvrc
    ~/.claude/CLAUDE.md:
      force: true
      path: claude/CLAUDE.md
    ~/.claude/settings.json:
      force: true
      path: claude/settings.json
    ~/.pi/agent/AGENTS.md:
      force: true
      path: pi/agent/AGENTS.md
    ~/.pi/agent/settings.json:
      force: true
      path: pi/agent/settings.json
    ~/.pi/agent/extensions:
      force: true
      path: pi/agent/extensions/
    ~/.pi/agent/skills:
      force: true
      path: pi/agent/skills/
    ~/.config/nvim: 
      force: true
      path: nvim/
    # X11 / dwm: Linux only
    ~/git/dwm-flexipatch/patches.h:
      if: *linux
      path: dwm-flexipatch/patches.h
    ~/git/dwm-flexipatch/config.h:
      if: *linux
      force: true
      path: dwm-flexipatch/config.h
    ~/.dwm/autostart.sh:
      if: *linux
      create: true
      path: dwm-flexipatch/autostart.sh
    ~/.xinitrc:
      if: *linux
      path: dwm-flexipatch/xinitrc
    ~/.Xresources:
      if: *linux
      path: dwm-flexipatch/Xresources
    ~/git/dmenu-flexipatch/patches.h:
      if: *linux
      path: dmenu-flexipatch/patches.h
    ~/git/dmenu-flexipatch/config.h:
      if: *linux
      path: dmenu-flexipatch/config.h
    ~/git/dwmblocks-async/config.h:
      if: *linux
      force: true
      path: dwmblocks-async/config.h
    ~/.local/bin/statusbar:
      if: *linux
      path: bin/statusbar/

- shell:
  - [git submodule update --init --recursive, Installing submodules]

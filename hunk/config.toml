theme = "gruvbox-dark-hard"
mode = "auto"
line_numbers = true
wrap_lines = true
hunk_headers = true
menu_bar = true
agent_notes = false
copy_decorations = false
cursor_line = "row"

# Auto-reload repository reviews opened with `hunk diff`.
# This does not affect `hunk pager` (jj diff), which reads a fixed stdin patch.
[vcs]
watch = true

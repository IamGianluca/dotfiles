theme = "gruvbox-dark-hard"
mode = "auto"
line_numbers = true
wrap_lines = true
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"

# Auto-reload repository reviews (`hunk diff`) when their source changes.
# Must stay in a command table: top-level `watch` also applies to `hunk pager`,
# which reads jj's stdin patch and cannot be watched, breaking `jj diff`.
[vcs]
watch = true
